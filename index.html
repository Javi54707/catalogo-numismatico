<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Catálogo Numismático</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>🏛️ Colección Numismática</h1>
    </header>
    
    <main>
        <section id="panel-creacion" style="background: var(--card-bg); padding: 1.5rem; border-radius: 8px; margin-bottom: 2rem; border: 1px solid var(--border-color);">
            <h2>➕ Añadir Nueva Moneda</h2>
            <form id="form-nueva-moneda" style="display: grid; gap: 1rem; grid-template-columns: 1fr 1fr;">
                <input type="text" id="in-id" placeholder="ID (ej. ESP-1980-5PTA)" required>
                <input type="text" id="in-valor" placeholder="Valor Facial (ej. 5 Pesetas)" required>
                <input type="number" id="in-ano" placeholder="Año visible (ej. 1980)" required>
                <input type="number" step="0.01" id="in-precio" placeholder="Precio de compra (€)" required>
                
                <div style="grid-column: 1 / -1;">
                    <label style="font-size: 0.9rem; color: var(--text-secondary);">Foto Anverso (jpg/png):</label>
                    <input type="file" id="in-foto-anv" accept="image/png, image/jpeg" required>
                </div>
                
                <button type="submit" style="grid-column: 1 / -1; background: var(--accent); color: white; padding: 0.75rem; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
                    Procesar y Guardar Pieza
                </button>
            </form>
        </section>
        <section id="galeria" class="grid-container">
            <!-- JavaScript inyectará las tarjetas aquí -->
        </section>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
